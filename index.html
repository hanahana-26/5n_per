<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>どちらがこんでいるかな？</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .dot {
            touch-action: none;
            user-select: none;
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        /* 1画面に収めるための調整 */
        @media (min-height: 800px) {
            .container-box { height: 16rem; } /* h-64 */
        }
        @media (max-height: 799px) {
            .container-box { height: 12rem; } /* h-48 */
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-2 md:p-4 font-sans text-slate-800 select-none">

    <div class="max-w-6xl mx-auto">
        <!-- ヘッダー -->
        <header class="mb-4 flex flex-col md:flex-row justify-between items-center gap-2 border-b border-slate-200 pb-3">
            <div>
                <h1 class="text-2xl font-black text-slate-900">どちらがこんでいるかな？</h1>
                <p class="text-xs text-slate-500 font-medium">配置ボタンで並べます。ドラッグで自由に移動できます。</p>
            </div>
            <div class="flex gap-2">
                <button onclick="addGroup()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg shadow-md transition-all active:scale-95 text-sm font-bold">
                    ＋ 班を追加
                </button>
                <button onclick="resetAll()" class="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded-lg shadow-md transition-all active:scale-95 text-sm font-bold">
                    🔄 リセット
                </button>
            </div>
        </header>

        <!-- 2列のグリッドレイアウト -->
        <div id="groups-container" class="grid grid-cols-2 gap-4 items-start">
            <!-- JSで動的に生成されます -->
        </div>
    </div>

    <script>
        const COLORS = [
            { bg: 'bg-blue-50', border: 'border-blue-400' },
            { bg: 'bg-yellow-50', border: 'border-yellow-400' },
            { bg: 'bg-pink-50', border: 'border-pink-400' },
            { bg: 'bg-green-50', border: 'border-green-400' },
        ];

        let groups = [];

        // 初期状態を1班のみに設定
        function initGroups() {
            groups = [{
                id: Date.now(),
                name: 'A班',
                colorIdx: 0,
                sections: 4,
                dots: [],
                inputCount: 10
            }];
        }

        let activeDrag = null;
        let isMoving = false;

        function addGroup() {
            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            const nextIdx = groups.length % COLORS.length;
            groups.push({
                id: Date.now(),
                name: `${alphabet[groups.length] || '新'}班`,
                colorIdx: nextIdx,
                sections: 4,
                dots: [],
                inputCount: 10
            });
            render();
        }

        function removeGroup(id) {
            if (groups.length <= 1) return; // 最後の1つの場合は削除しない（任意）
            groups = groups.filter(g => g.id !== id);
            render();
        }

        function updateSections(id, delta) {
            const group = groups.find(g => g.id === id);
            if (group) {
                group.sections = Math.max(1, group.sections + delta);
                render();
            }
        }

        function generateDots(id) {
            const group = groups.find(g => g.id === id);
            if (!group) return;

            const count = group.inputCount || 0;
            const newDots = [];
            const maxAttempts = 2000; 
            
            const minDX = 8;  
            const minDY = 18; 
            const marginFromLine = 6; 

            for (let i = 0; i < count; i++) {
                let found = false;
                let attempts = 0;

                while (!found && attempts < maxAttempts) {
                    attempts++;
                    const x = 6 + Math.random() * 88;
                    const y = 12 + Math.random() * 76;

                    const sectionWidth = 100 / group.sections;
                    const distanceFromLine = x % sectionWidth;
                    const isNearLine = distanceFromLine < marginFromLine || distanceFromLine > (sectionWidth - marginFromLine);
                    
                    if (isNearLine && group.sections > 1) continue;

                    const isOverlapping = newDots.some(d => {
                        return Math.abs(d.x - x) < minDX && Math.abs(d.y - y) < minDY;
                    });

                    if (!isOverlapping) {
                        newDots.push({ id: `dot-${Date.now()}-${i}-${Math.random()}`, x, y });
                        found = true;
                    }
                }
                if (!found) break;
            }
            group.dots = newDots;
            render();
        }

        function startDrag(groupId, dotId, e) {
            e.stopPropagation();
            const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            
            activeDrag = { groupId, dotId, startX: clientX, startY: clientY };
            isMoving = false;
            document.body.classList.add('cursor-grabbing');
        }

        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchmove', (e) => {
            if (activeDrag) {
                if (e.cancelable) e.preventDefault();
                handleMove(e.touches[0]);
            }
        }, { passive: false });

        function handleMove(e) {
            if (!activeDrag) return;
            isMoving = true;
            const { groupId, dotId } = activeDrag;
            const container = document.getElementById(`box-${groupId}`);
            if (!container) return;
            
            const rect = container.getBoundingClientRect();
            let x = ((e.clientX - rect.left) / rect.width) * 100;
            let y = ((e.clientY - rect.top) / rect.height) * 100;

            x = Math.max(3, Math.min(97, x));
            y = Math.max(5, Math.min(95, y));

            const group = groups.find(g => g.id === groupId);
            const dot = group.dots.find(d => d.id === dotId);
            if (dot) {
                dot.x = x;
                dot.y = y;
                const dotEl = document.getElementById(dotId);
                if (dotEl) {
                    dotEl.style.left = x + '%';
                    dotEl.style.top = y + '%';
                }
            }
        }

        window.addEventListener('mouseup', endDrag);
        window.addEventListener('touchend', endDrag);

        function endDrag() {
            if (!activeDrag) return;
            setTimeout(() => { isMoving = false; }, 50);
            activeDrag = null;
            document.body.classList.remove('cursor-grabbing');
        }

        function resetAll() {
            initGroups();
            render();
        }

        function render() {
            const container = document.getElementById('groups-container');
            container.innerHTML = '';

            groups.forEach(group => {
                const color = COLORS[group.colorIdx];
                const card = document.createElement('div');
                card.className = "bg-white p-3 rounded-2xl shadow-sm border border-slate-200 transition-all";
                
                let gridLines = '';
                for (let i = 1; i < group.sections; i++) {
                    gridLines += `<div class="h-full border-r-2 absolute top-0" style="left: ${(i/group.sections)*100}%; border-color: inherit; opacity: 0.25;"></div>`;
                }

                let dotsHtml = '';
                group.dots.forEach(dot => {
                    dotsHtml += `
                        <div id="${dot.id}"
                             onmousedown="startDrag(${group.id}, '${dot.id}', event)"
                             ontouchstart="startDrag(${group.id}, '${dot.id}', event)"
                             class="dot absolute w-7 h-7 bg-orange-600 rounded-full shadow-md border border-orange-700/30 transform -translate-x-1/2 -translate-y-1/2 cursor-grab active:cursor-grabbing z-20 hover:scale-110 transition-transform"
                             style="left: ${dot.x}%; top: ${dot.y}%;">
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="flex items-center justify-between mb-2 gap-1">
                        <div class="flex items-center gap-1 scale-90 origin-left">
                            <input type="text" value="${group.name}" onchange="groups.find(g=>g.id===${group.id}).name=this.value" class="text-lg font-black bg-transparent border-b border-transparent hover:border-slate-300 focus:border-indigo-500 focus:outline-none w-14">
                            <div class="flex bg-slate-50 rounded-lg border border-slate-200 p-0.5">
                                <button onclick="updateSections(${group.id}, -1)" class="w-6 h-6 flex items-center justify-center hover:bg-white rounded transition-all font-bold text-xs">-</button>
                                <span class="px-2 text-[10px] font-bold flex items-center whitespace-nowrap">${group.sections}枚</span>
                                <button onclick="updateSections(${group.id}, 1)" class="w-6 h-6 flex items-center justify-center hover:bg-white rounded transition-all font-bold text-xs">+</button>
                            </div>
                        </div>
                        <div class="flex items-center gap-1 scale-90 origin-right">
                            <input type="number" value="${group.inputCount}" onchange="groups.find(g=>g.id===${group.id}).inputCount=parseInt(this.value)" class="w-10 text-center bg-slate-50 border border-slate-200 rounded py-0.5 font-bold text-sm">
                            <button onclick="generateDots(${group.id})" class="bg-indigo-500 hover:bg-indigo-600 text-white px-2 py-0.5 rounded text-xs font-bold shadow-sm">配置</button>
                            <button onclick="removeGroup(${group.id})" class="text-slate-300 hover:text-red-500 px-1">✕</button>
                        </div>
                    </div>
                    <div id="box-${group.id}" class="container-box relative w-full border-[4px] rounded-xl overflow-hidden cursor-default transition-all shadow-inner ${color.bg} ${color.border}">
                        ${gridLines}
                        ${dotsHtml}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        initGroups();
        render();
    </script>
</body>
</html>

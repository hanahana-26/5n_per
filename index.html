<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>どちらがこんでいるかな？</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .dot {
            touch-action: none;
            user-select: none;
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8 font-sans text-slate-800 select-none">

    <div class="max-w-6xl mx-auto">
        <!-- ヘッダー -->
        <header class="mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-200 pb-6">
            <div>
                <h1 class="text-3xl font-black text-slate-900 flex items-center gap-2">
                    どちらがこんでいるかな？
                </h1>
                <p class="text-sm text-slate-500 font-medium mt-1">「配置」ボタンで重ならないように丸を並べます。ドラッグで移動して比べることもできます。</p>
            </div>
            <button onclick="addGroup()" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl shadow-lg transition-all active:scale-95 font-bold">
                <span>＋ 班を追加</span>
            </button>
        </header>

        <!-- 班のリスト -->
        <div id="groups-container" class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-start pb-24">
            <!-- JSで動的に生成されます -->
        </div>

        <!-- 固定アクションボタン -->
        <div class="fixed bottom-6 right-6 flex flex-col gap-3">
            <button onclick="resetAll()" class="flex items-center justify-center gap-2 bg-slate-800 text-white px-8 py-4 rounded-2xl font-bold shadow-xl hover:bg-black transition-all active:scale-95">
                🔄 ぜんぶやりなおし
            </button>
        </div>
    </div>

    <script>
        const COLORS = [
            { bg: 'bg-blue-100', border: 'border-blue-400' },
            { bg: 'bg-yellow-100', border: 'border-yellow-400' },
            { bg: 'bg-pink-100', border: 'border-pink-400' },
            { bg: 'bg-green-100', border: 'border-green-400' },
        ];

        let groups = [
            { id: Date.now(), name: 'A班', colorIdx: 0, sections: 4, dots: [], inputCount: 10 }
        ];

        let activeDrag = null;
        let isMoving = false;

        function addGroup() {
            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            const nextIdx = groups.length % COLORS.length;
            groups.push({
                id: Date.now(),
                name: `${alphabet[groups.length] || '新'}班`,
                colorIdx: nextIdx,
                sections: 3,
                dots: [],
                inputCount: 5
            });
            render();
        }

        function removeGroup(id) {
            groups = groups.filter(g => g.id !== id);
            render();
        }

        function updateSections(id, delta) {
            const group = groups.find(g => g.id === id);
            if (group) {
                group.sections = Math.max(1, group.sections + delta);
                render();
            }
        }

        // 赤丸の自動配置ロジック
        function generateDots(id) {
            const group = groups.find(g => g.id === id);
            if (!group) return;

            const count = group.inputCount || 0;
            const newDots = [];
            const maxAttempts = 3000; 
            
            const minDX = 8;  
            const minDY = 16; 
            const marginFromLine = 5; 

            for (let i = 0; i < count; i++) {
                let found = false;
                let attempts = 0;

                while (!found && attempts < maxAttempts) {
                    attempts++;
                    const x = 5 + Math.random() * 90;
                    const y = 10 + Math.random() * 80;

                    const sectionWidth = 100 / group.sections;
                    const distanceFromLine = x % sectionWidth;
                    const isNearLine = distanceFromLine < marginFromLine || distanceFromLine > (sectionWidth - marginFromLine);
                    
                    if (isNearLine && group.sections > 1) continue;

                    const isOverlapping = newDots.some(d => {
                        return Math.abs(d.x - x) < minDX && Math.abs(d.y - y) < minDY;
                    });

                    if (!isOverlapping) {
                        newDots.push({ id: `dot-${Date.now()}-${i}-${Math.random()}`, x, y });
                        found = true;
                    }
                }
                
                if (!found) break;
            }
            group.dots = newDots;
            render();
        }

        function startDrag(groupId, dotId, e) {
            e.stopPropagation();
            const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            
            activeDrag = { groupId, dotId, startX: clientX, startY: clientY };
            isMoving = false;
            document.body.classList.add('cursor-grabbing');
        }

        window.addEventListener('mousemove', (e) => handleMove(e));
        window.addEventListener('touchmove', (e) => {
            if (activeDrag) {
                if (e.cancelable) e.preventDefault();
                handleMove(e.touches[0]);
            }
        }, { passive: false });

        function handleMove(e) {
            if (!activeDrag) return;
            
            isMoving = true;
            const { groupId, dotId } = activeDrag;
            const container = document.getElementById(`box-${groupId}`);
            if (!container) return;
            
            const rect = container.getBoundingClientRect();

            let x = ((e.clientX - rect.left) / rect.width) * 100;
            let y = ((e.clientY - rect.top) / rect.height) * 100;

            x = Math.max(2, Math.min(98, x));
            y = Math.max(4, Math.min(96, y));

            const group = groups.find(g => g.id === groupId);
            const dot = group.dots.find(d => d.id === dotId);
            if (dot) {
                dot.x = x;
                dot.y = y;
                const dotEl = document.getElementById(dotId);
                if (dotEl) {
                    dotEl.style.left = x + '%';
                    dotEl.style.top = y + '%';
                }
            }
        }

        window.addEventListener('mouseup', () => endDrag());
        window.addEventListener('touchend', () => endDrag());

        function endDrag() {
            if (!activeDrag) return;
            setTimeout(() => { isMoving = false; }, 50);
            activeDrag = null;
            document.body.classList.remove('cursor-grabbing');
        }

        function resetAll() {
            groups = [{ id: Date.now(), name: 'A班', colorIdx: 0, sections: 4, dots: [], inputCount: 10 }];
            render();
        }

        function render() {
            const container = document.getElementById('groups-container');
            container.innerHTML = '';

            groups.forEach(group => {
                const color = COLORS[group.colorIdx];
                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-3xl shadow-sm border border-slate-200 transition-all hover:shadow-md";
                
                let gridLines = '';
                for (let i = 1; i < group.sections; i++) {
                    gridLines += `<div class="h-full border-r-2 absolute top-0" style="left: ${(i/group.sections)*100}%; border-color: inherit; opacity: 0.3;"></div>`;
                }

                let dotsHtml = '';
                group.dots.forEach(dot => {
                    dotsHtml += `
                        <div id="${dot.id}"
                             onmousedown="startDrag(${group.id}, '${dot.id}', event)"
                             ontouchstart="startDrag(${group.id}, '${dot.id}', event)"
                             class="dot absolute w-8 h-8 bg-orange-600 rounded-full shadow-lg border-2 border-orange-700/30 transform -translate-x-1/2 -translate-y-1/2 cursor-grab active:cursor-grabbing z-20 hover:scale-110 transition-transform"
                             style="left: ${dot.x}%; top: ${dot.y}%;">
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="flex flex-wrap items-center justify-between mb-4 gap-3">
                        <div class="flex items-center gap-3">
                            <input type="text" value="${group.name}" onchange="groups.find(g=>g.id===${group.id}).name=this.value" class="text-xl font-black bg-transparent border-b-2 border-transparent hover:border-slate-300 focus:border-indigo-500 focus:outline-none w-20 px-1">
                            <div class="flex bg-slate-50 rounded-xl border border-slate-200 p-1">
                                <button onclick="updateSections(${group.id}, -1)" class="w-8 h-8 flex items-center justify-center hover:bg-white rounded-lg transition-all font-bold">-</button>
                                <span class="px-3 text-sm font-bold flex items-center">${group.sections}シート</span>
                                <button onclick="updateSections(${group.id}, 1)" class="w-8 h-8 flex items-center justify-center hover:bg-white rounded-lg transition-all font-bold">+</button>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 bg-slate-50 p-1.5 rounded-xl border border-slate-200">
                            <input type="number" value="${group.inputCount}" onchange="groups.find(g=>g.id===${group.id}).inputCount=parseInt(this.value)" class="w-12 text-center bg-white border border-slate-200 rounded-lg py-1 font-bold focus:ring-2 focus:ring-indigo-500 outline-none">
                            <button onclick="generateDots(${group.id})" class="bg-indigo-500 hover:bg-indigo-600 text-white px-4 py-1 rounded-lg text-sm font-bold transition-all shadow-sm active:scale-95">配置</button>
                            <button onclick="removeGroup(${group.id})" class="p-2 text-slate-400 hover:text-red-500 transition-colors text-xl">🗑️</button>
                        </div>
                    </div>
                    <div id="box-${group.id}" class="relative h-64 w-full border-[6px] rounded-2xl overflow-hidden cursor-default transition-all shadow-inner ${color.bg} ${color.border}">
                        ${gridLines}
                        ${dotsHtml}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        render();
    </script>
</body>
</html>
